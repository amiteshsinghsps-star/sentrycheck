[workspace]
members = ["crates/sentrycheck-core", "crates/sentrycheck-static", "crates/sentrycheck-kb", "crates/sentrycheck-dynamic", "crates/sentrycheck-cli"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
flate2 = "1.0"
tar = "0.4"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }
sentrycheck-core = { path = "crates/sentrycheck-core" }
sentrycheck-static = { path = "crates/sentrycheck-static" }
sentrycheck-kb = { path = "crates/sentrycheck-kb" }
sentrycheck-dynamic = { path = "crates/sentrycheck-dynamic" }

[profile.release]
lto = "thin"
strip = true
overflow-checks = true

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
