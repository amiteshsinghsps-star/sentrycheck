name: build-and-test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema && python -m unittest discover -s tests -v
      - name: Contract schemas must regenerate byte-identically
        run: |
          python scripts/write_schemas.py
          git diff --exit-code -- schema bench/schema
      - name: Benchmark contract selftests
        continue-on-error: true
        run: python -m unittest discover -s bench/tests -t . -v
      - run: python -m pip install playwright==1.62.0
        if: runner.os == 'Linux'
      - run: python scripts/test_viewer.py
        if: runner.os == 'Linux'
      - run: python docs/evidence/audit-v03/kb_checks.py
      - run: python scripts/evaluate.py --suite synthetic
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation-${{ matrix.os }}
          path: artifacts/evaluation/metrics.json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: git diff --exit-code -- frontend/template.html
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - run: go test ./...
        working-directory: integration
      - run: go vet ./...
        working-directory: integration
      - run: test -z "$(gofmt -l integration)"
  live-synthetic:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y runc strace
      - run: python3 scripts/install_runsc.py --version 20260921.0 --out .cache/linux/bin
      - run: cargo build --locked
      - run: sudo bash scripts/live-smoke.sh
      - run: sudo env SENTRYCHECK_BIN="$PWD/target/debug/sentrycheck" bash scripts/live-capture-limit.sh
      - run: sudo env SENTRYCHECK_BIN="$PWD/target/debug/sentrycheck" bash scripts/live-trace-limit.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-synthetic-observations
          path: artifacts/live-validation/
